[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mldoctor"
version = "0.1.0"
description = "Reproduce, investigate, patch, and verify broken ML training scripts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "httpx", "matplotlib"]

[project.optional-dependencies]
fixtures = ["torch", "scikit-learn"]
test = ["pytest", "httpx"]

[project.scripts]
mldoctor = "mldoctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mldoctor = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not slow\""
markers = ["slow: training-heavy tests excluded from the default fast run"]
