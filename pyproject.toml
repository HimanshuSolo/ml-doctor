[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mldoctor"
version = "0.1.0"
description = "Reproduce, investigate, patch, and verify broken ML training scripts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # Stage 1: core stdlib-only; web/llm/plot deps added per stage with approval

[project.optional-dependencies]
fixtures = ["torch", "scikit-learn"]
test = ["pytest"]

[project.scripts]
mldoctor = "mldoctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
